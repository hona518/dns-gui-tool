name: Build Windows EXE

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Wails CLI
      run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

    - name: Scaffold Wails Project
      run: wails init -n dns-gui -t vue

    - name: Inject Custom Code Files
      shell: pwsh
      run: |
        # 删除生成的默认无效文件
        Remove-Item -Path "dns-gui\frontend\src\App.vue" -Force
        Remove-Item -Path "dns-gui\app.go" -Force
        Remove-Item -Path "dns-gui\main.go" -Force
        
        # 将根目录的自定义文件强行注入到标准工程目录中
        Copy-Item -Path "App.vue" -Destination "dns-gui\frontend\src\App.vue" -Force
        Copy-Item -Path "main.go" -Destination "dns-gui\main.go" -Force
    - name: Inject Custom Code Files
      shell: pwsh
      run: |
        Remove-Item -Path "dns-gui\frontend\src\App.vue" -Force
        Remove-Item -Path "dns-gui\app.go" -Force
        Remove-Item -Path "dns-gui\main.go" -Force
        Copy-Item -Path "App.vue" -Destination "dns-gui\frontend\src\App.vue" -Force
        Copy-Item -Path "main.go" -Destination "dns-gui\main.go" -Force

    # --- 新增这个步骤：拉取华为云官方依赖 ---
    - name: Fetch Go Dependencies
      working-directory: ./dns-gui
      run: |
        go get github.com/huaweicloud/huaweicloud-sdk-go-v3/services/dns/v2
        go mod tidy
    # ----------------------------------------

    - name: Install NPM & Compile Executable
      working-directory: ./dns-gui
      run: wails build -platform windows/amd64 -m
    - name: Install NPM & Compile Executable
      working-directory: ./dns-gui
      run: wails build -platform windows/amd64 -m

    - name: Upload EXE File
      uses: actions/upload-artifact@v4
      with:
        name: DNS-Manager-Windows
        path: dns-gui/build/bin/*.exe
